<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="bg-white border border-gray-200 rounded-lg shadow-lg w-full max-w-lg p-6">
    <h2 class="text-lg font-semibold mb-4">Novo Cliente</h2>

    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
      <input formControlName="nome" placeholder="Nome" class="w-full border p-2 rounded" />
      <input formControlName="cnpj" placeholder="CNPJ" class="w-full border p-2 rounded" />
      <input formControlName="email" placeholder="Email" class="w-full border p-2 rounded" />
      <input formControlName="telefone" placeholder="Telefone" class="w-full border p-2 rounded" />
      <input formControlName="endereco" placeholder="Endereço" class="w-full border p-2 rounded" />

      @if (serverError) {
        <p class="text-sm text-red-500">{{ serverError }}</p>
      }

      <div class="flex justify-end space-x-2">
        <button type="button" (click)="cancel()" class="px-4 py-2 bg-gray-200 rounded">Fechar</button>
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Salvar</button>
      </div>
    </form>
  </div>
</div>
