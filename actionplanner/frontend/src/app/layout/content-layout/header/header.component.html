<div class="w-full h-16 bg-white border-b border-[#f8fafc] shadow-sm">
  <div class="flex items-center justify-between h-full 3">
    <div class="flex items-center">
      <img src="images/logo/logo.png" alt="Logo" class="h-30">
    </div>
    
    <!-- Breadcrumb -->
    <div class="flex-1 px-6">
      <z-breadcrumb zSize="default">
        <z-breadcrumb-item [routerLink]="['/']">
          Home
        </z-breadcrumb-item>
        <z-breadcrumb-separator></z-breadcrumb-separator>
        <z-breadcrumb-item [zActive]="true">
          Dashboard
        </z-breadcrumb-item>
      </z-breadcrumb>
    </div>

    <div class="flex items-center space-x-4 pr-6">
      <!-- Ícone de notificação -->
      <button class="relative w-10 h-10 flex items-center justify-center text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors" title="Notificações">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <!-- Badge de notificação -->
        <span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full"></span>
      </button>

      <!-- Avatar do usuário -->
      <z-avatar 
        [fallback]="currentUser.name.charAt(0).toUpperCase() || 'U'"
        zSize="default"
        zShape="rounded"
        zVariant="custom"
        class="cursor-pointer hover:opacity-80 transition-opacity">
      </z-avatar>
    </div>
  </div>
</div>
