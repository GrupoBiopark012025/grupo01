<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="bg-white border border-gray-200 rounded-lg shadow-lg w-full max-w-lg p-6">
    <h2 class="text-lg font-semibold mb-4">Novo Cliente</h2>

    <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="save()">
      <div>
        <label for="nome" class="block text-sm font-medium mb-1">Nome *</label>
        <input 
          id="nome" 
          type="text" 
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          formControlName="nome"
          placeholder="Digite o nome do cliente"
        >
        @if (form.get('nome')?.invalid && form.get('nome')?.touched) {
          <p class="text-sm text-red-500 mt-1">Nome é obrigatório</p>
        }
      </div>

      <div>
        <label for="cnpj" class="block text-sm font-medium mb-1">CNPJ *</label>
        <input 
          id="cnpj" 
          type="text" 
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          formControlName="cnpj"
          placeholder="Digite o CNPJ"
        >
        @if (form.get('cnpj')?.invalid && form.get('cnpj')?.touched) {
          <p class="text-sm text-red-500 mt-1">CNPJ é obrigatório</p>
        }
      </div>

      <div>
        <label for="email" class="block text-sm font-medium mb-1">Email</label>
        <input 
          id="email" 
          type="email" 
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          formControlName="email"
          placeholder="Digite o email"
        >
      </div>

      <div>
        <label for="telefone" class="block text-sm font-medium mb-1">Telefone</label>
        <input 
          id="telefone" 
          type="text" 
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          formControlName="telefone"
          placeholder="Digite o telefone"
        >
      </div>

      <div>
        <label for="endereco" class="block text-sm font-medium mb-1">Endereço</label>
        <input 
          id="endereco" 
          type="text" 
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          formControlName="endereco"
          placeholder="Digite o endereço"
        >
      </div>

      @if (serverError) {
        <div class="w-full p-3 rounded bg-red-100 text-red-700 border border-red-300">
          {{ serverError }}
        </div>
      }

      <div class="flex justify-end gap-2">
        <button z-button zType="outline" type="button" (click)="cancel()">
          Cancelar
        </button>
        <button z-button type="submit">
          Salvar
        </button>
      </div>
    </form>
  </div>
</div>
