      <h2 class="text-4xl font-bold text-red-600 mb-2">Ops!</h2>

      <h4 class="text-2xl font-semibold mb-4">
        Acesso negado.
      </h4>

      <p class="text-lg text-gray-700 mb-6">
        Parece que você não tem acesso à essa página ou recurso.
      </p>

      <a class="inline-block px-8 py-3 text-lg font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition duration-150 ease-in-out"

        Ir para a página inicial
      </a>

  </div>
</div>
