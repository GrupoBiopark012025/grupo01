<div class="flex flex-col md:flex-row items-center mb-2 gap-y-2 md:gap-y-0">
  <div class="flex-grow">
    <h3 class="text-xl font-semibold">{{ title() }}</h3>
  </div>

  <div class="flex-shrink-0">
    <div class="flex gap-2">
      <div>
        <button z-button (click)="onActionClicked.emit()">
          {{ actionTitle() }}
        </button>
      </div>
    </div>
  </div>
</div>
