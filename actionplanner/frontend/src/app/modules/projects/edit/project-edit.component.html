<div class="container mx-auto px-4 py-6">
  <!-- Header -->
  <div class="mb-6">
    <div class="flex items-center gap-4 mb-2">
      <button
        type="button"
        class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-700 hover:text-gray-900"
        (click)="goBack()"
      >
        <lucide-icon [img]="icons.ArrowLeftIcon" [size]="16"></lucide-icon>
        Voltar
      </button>
    </div>
    <h1 class="text-2xl font-bold text-gray-900">Editar Projeto</h1>
  </div>

  <!-- Loading skeleton -->
  <div *ngIf="loading()" class="bg-white rounded-lg shadow p-6">
    <div class="animate-pulse space-y-4">
      <div class="h-4 bg-gray-200 rounded w-1/4"></div>
      <div class="h-10 bg-gray-200 rounded"></div>
      <div class="h-4 bg-gray-200 rounded w-1/4"></div>
      <div class="h-32 bg-gray-200 rounded"></div>
    </div>
  </div>

  <!-- Form -->
  <form *ngIf="!loading() && project()" [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white rounded-lg shadow">
    <div class="p-6 space-y-6">
      <!-- Nome -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
          Nome do Projeto <span class="text-red-500">*</span>
        </label>
        <input
          id="name"
          z-input
          type="text"
          formControlName="name"
          placeholder="Digite o nome do projeto"
          [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched"
        />
        <p *ngIf="form.get('name')?.hasError('required') && form.get('name')?.touched" class="mt-1 text-sm text-red-500">
          Nome é obrigatório
        </p>
      </div>

      <!-- Descrição -->
      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
          Descrição
        </label>
        <textarea
          id="description"
          z-input
          formControlName="description"
          placeholder="Digite a descrição do projeto (opcional)"
          rows="4"
        ></textarea>
      </div>

      <!-- Status -->
      <div>
        <label for="status" class="block text-sm font-medium text-gray-700 mb-2">
          Status <span class="text-red-500">*</span>
        </label>
        <select
          id="status"
          z-input
          formControlName="status"
        >
          <option value="ATIVO">Ativo</option>
          <option value="INATIVO">Inativo</option>
        </select>
      </div>
    </div>

    <!-- Footer -->
    <div class="bg-gray-50 px-6 py-4 rounded-b-lg flex justify-end gap-3">
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
        (click)="goBack()"
        [disabled]="saving()"
      >
        Cancelar
      </button>
      <button
        type="submit"
        class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="saving() || form.invalid"
      >
        <lucide-icon *ngIf="!saving()" [img]="icons.SaveIcon" [size]="16"></lucide-icon>
        <span *ngIf="saving()" class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        {{ saving() ? 'Salvando...' : 'Salvar Alterações' }}
      </button>
    </div>
  </form>

  <!-- Not Found -->
  <div *ngIf="!loading() && !project()" class="bg-white rounded-lg shadow p-12 text-center">
    <p class="text-gray-500 mb-4">Projeto não encontrado</p>
    <button
      type="button"
      class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-md hover:bg-blue-700"
      (click)="goBack()"
    >
      Voltar
    </button>
  </div>
</div>
