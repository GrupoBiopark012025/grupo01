@if (clients$ | async; as clients) {
  @if (clients.data.length; as recordsInView) {
    <div class="flex flex-col gap-3 p-3">
      @for (client of clients.data; track client.id) {
        <div
          class="flex items-center justify-between rounded-xl border p-3 transition-all duration-150"
          [class.cursor-pointer]="client.id !== loggedClientId"
          [class.hover:bg-muted-foreground]="client.id !== loggedClientId"
          [class.bg-muted]="client.id === loggedClientId"
          [class.opacity-70]="client.id === loggedClientId"
          [class.pointer-events-none]="client.id === loggedClientId"
          (click)="client.id !== loggedClientId && changeEnvironmentToClient(client.id)"
        >
          <div class="flex grow flex-col">
            <span class="font-medium">{{ client.nome }}</span>
            <span class="text-sm text-muted-foreground">{{ client.cnpj }}</span>
          </div>

          @if (client.id === loggedClientId) {
            <i-lucide [img]="icons.check" class="text-success" />
          } @else {
            <i-lucide [img]="icons.chevronRight" />
          }
        </div>
      }
    </div>

    <app-pagination
      [currentPage]="query().page"
      [pageSize]="query().size"
      [recordsInView]="recordsInView"
      [totalPages]="clients.totalPages"
      [collectionSize]="clients.totalData"
      (onPageChange)="changeQuery({ page: $event })"
    />
  } @else {
    <app-no-list-content
      text="Nenhum cliente vinculado ao usuário."
    />
  }
}
